<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 제조 플랫폼 닷코 소개 | DATCO</title>

<!-- Open Graph (카카오톡/문자 링크 미리보기) -->
<meta property="og:type" content="website">
<meta property="og:title" content="AI 제조 플랫폼 닷코 소개">
<meta property="og:description" content="회사소개서 · 서비스 비교표 · DAT-V 영상 · 브랜드 필름을 한 페이지에서 확인하세요.">
<meta property="og:url" content="https://hyunholim57.github.io/datco-intro/">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
  :root {
    --red: #E14134;
    --red-dark: #C33529;
    --red-tint: #FDEDEB;
    --ink: #1F2328;
    --gray-700: #454C53;
    --gray-500: #71787F;
    --gray-300: #D7DBDF;
    --gray-100: #F4F5F6;
    --bg: #EFF1F3;
    --card: #FFFFFF;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    text-align: left;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  @media (min-width: 640px) {
    .wrap { padding: 32px 24px 72px; }
  }

  /* ===== 언어 전환 ===== */
  .lang-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  .lang-toggle {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--gray-300);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 1px 3px rgba(31,35,40,.06);
  }
  .lang-toggle button {
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-500);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .lang-toggle button.active {
    background: var(--red);
    color: #fff;
  }

  /* ===== 카드 공통 ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(31,35,40,.06), 0 8px 24px rgba(31,35,40,.05);
    overflow: hidden;
  }

  /* ===== 히어로 ===== */
  .hero { padding: 32px 24px 8px; }
  @media (min-width: 640px) { .hero { padding: 44px 44px 12px; } }
  .brand { margin-bottom: 22px; }
  .brand img { height: 28px; display: block; }
  h1 {
    font-size: 25px;
    font-weight: 800;
    line-height: 1.4;
    letter-spacing: -.01em;
  }
  @media (min-width: 640px) { h1 { font-size: 30px; } }
  .hero-sub {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--red);
    letter-spacing: -.005em;
  }
  @media (min-width: 640px) { .hero-sub { font-size: 15px; } }
  .hero-rule {
    height: 1px; background: var(--gray-300);
    margin: 20px 0;
  }
  .greeting {
    font-size: 15px;
    color: var(--gray-700);
    margin-bottom: 8px;
  }
  @media (min-width: 640px) { .greeting { font-size: 16px; } }
  .greeting strong { color: var(--ink); }

  /* ===== 핵심 소개: 라벨 + 설명 그리드 (열·행 일관 구조) ===== */
  .feature-list { margin-top: 16px; }
  .feature {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    padding: 16px 0;
    border-top: 1px solid var(--gray-100);
  }
  @media (min-width: 560px) {
    .feature {
      grid-template-columns: 148px 1fr;
      gap: 16px;
      padding: 18px 0;
    }
  }
  .feature-label {
    display: inline-flex;
    align-items: center;
    align-self: start;
    justify-self: start;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    color: var(--red);
    background: var(--red-tint);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
  }
  .feature-text {
    font-size: 15px;
    color: var(--gray-700);
    line-height: 1.75;
  }
  @media (min-width: 640px) { .feature-text { font-size: 15.5px; } }
  .feature-text strong { color: var(--ink); font-weight: 700; }
  .feature-text .accent { color: var(--red); font-weight: 700; }
  .hero-close {
    padding: 16px 0 24px;
    border-top: 1px solid var(--gray-100);
    font-size: 15px;
    color: var(--gray-700);
  }

  /* ===== 성과 하이라이트 ===== */
  .stat-band {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--red-tint);
    border-radius: 12px;
    padding: 16px 20px;
    margin: 4px 0 20px;
  }
  .stat-icon {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .stat-icon svg { width: 22px; height: 22px; }
  .stat-text {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-700);
    line-height: 1.5;
  }
  .stat-text strong { color: var(--ink); font-weight: 800; }
  .stat-number {
    flex: none;
    font-size: 34px;
    font-weight: 800;
    line-height: 1;
    color: var(--red);
    letter-spacing: -.02em;
  }
  @media (min-width: 640px) { .stat-number { font-size: 38px; } }

  /* ===== 주요 기능 아이콘 ===== */
  .modules { padding: 24px 20px; }
  @media (min-width: 640px) { .modules { padding: 30px 36px; } }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 8px;
  }
  @media (min-width: 560px) {
    .icon-grid { grid-template-columns: repeat(8, 1fr); }
  }
  .module {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    text-align: center;
  }
  .module img {
    width: 54px;
    height: 54px;
    object-fit: contain;
  }
  .module-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gray-700);
    white-space: nowrap;
  }

  /* ===== 섹션 라벨 ===== */
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--gray-500);
    letter-spacing: .06em;
    margin: 36px 4px 14px;
  }
  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--gray-300);
  }

  /* ===== 문서 카드 ===== */
  .doc-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 560px) {
    .doc-grid { grid-template-columns: 1fr 1fr; }
  }
  a.doc {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 18px;
    text-decoration: none;
    color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.doc:active { transform: scale(.985); }
  @media (hover: hover) {
    a.doc:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(31,35,40,.08), 0 12px 28px rgba(31,35,40,.10);
    }
  }
  .doc-icon {
    width: 44px; height: 44px; flex: none;
    border-radius: 12px;
    background: var(--red-tint);
    display: flex; align-items: center; justify-content: center;
  }
  .doc-icon svg { width: 22px; height: 22px; }
  .doc-body { min-width: 0; flex: 1; }
  .doc-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .doc-sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
  .doc-arrow { flex: none; color: var(--red); font-weight: 700; }

  /* ===== 영상 카드 ===== */
  .video-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .video-grid { grid-template-columns: 1fr 1fr; }
  }
  .video-card .frame {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video-card iframe,
  .video-card .thumb-btn {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .thumb-btn { cursor: pointer; padding: 0; background: #000; display: block; }
  .thumb-btn img {
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .9;
    display: block;
  }
  .play-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(225,65,52,.95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    transition: transform .15s ease;
  }
  .thumb-btn:hover .play-badge { transform: translate(-50%, -50%) scale(1.08); }
  .play-badge svg { width: 22px; height: 22px; margin-left: 3px; }
  .video-meta { padding: 14px 18px 16px; }
  .video-title { font-size: 16px; font-weight: 700; }
  .video-sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }

  /* ===== 비즈니스 책임자 ===== */
  .contact { margin-top: 36px; padding: 24px; }
  @media (min-width: 640px) { .contact { padding: 30px 44px; } }
  .contact-head { margin-bottom: 18px; }
  .contact-name { font-size: 18px; font-weight: 800; }
  .contact-role { font-size: 13.5px; color: var(--gray-500); margin-top: 2px; }
  .contact-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (min-width: 560px) {
    .contact-actions { grid-template-columns: 1fr 1fr 1fr; }
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 10px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-ghost {
    background: var(--gray-100);
    color: var(--ink);
    border: 1px solid var(--gray-300);
  }
  .btn-ghost:hover { background: #E9EBED; }
  .btn-email { grid-column: 1 / -1; }
  @media (min-width: 560px) { .btn-email { grid-column: auto; } }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12.5px;
    color: var(--gray-500);
    line-height: 1.9;
  }
  footer .divider { margin: 0 6px; color: var(--gray-300); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 언어 전환 ===== -->
  <div class="lang-bar">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="btn-ko" class="active">한국어</button>

  <!-- ===== 히어로 ===== -->
  <section class="card hero">
    <div class="brand">

    <h1 data-ko="AI 제조 플랫폼 닷코를&lt;br&gt;안내 드립니다."

    <p class="hero-sub"

        <span class="feature-label" data-ko="하나의 플랫폼" data-en="One Platform"></span>

           data-ko="견적·수주부터 생산, 납품, 정산까지 &lt;strong&gt;회사의 모든 업무와 데이터가 하나로 연결&lt;/strong&gt;됩니다. 부서마다 따로 관리하던 정보가 한곳에 모여, 같은 데이터를 두 번 입력하거나 찾아 헤매는 일이 사라집니다."
           data-en="From quoting and orders to production, delivery, and settlement — &lt;strong&gt;all of your company's work and data are connected as one&lt;/strong&gt;. No more duplicate entry, no more hunting for information scattered across departments."></p>
      </div>
      <div class="feature">
        <span class="feature-label" data-ko="AI 업무 자동화" data-en="AI Automation"></span>
        <p class="feature-text"
           data-ko="사람이 반복하던 문서 작업과 확인 업무를 AI가 대신 처리합니다. &lt;strong&gt;직원들은 더 가치 있는 일에 집중&lt;/strong&gt;하고, 업무 누락과 실수는 줄어듭니다."
           data-en="AI takes over the repetitive paperwork and double-checking people used to do. &lt;strong&gt;Your team focuses on higher-value work&lt;/strong&gt;, with fewer omissions and errors."></p>
      </div>
      <div class="feature">
        <span class="feature-label" data-ko="실시간 경영 가시성" data-en="Real-time Visibility"></span>
        <p class="feature-text"
           data-ko="공장이 지금 무엇을 만들고 있는지, 돈이 어디서 들어오고 나가는지 한 화면에서 실시간으로 보입니다. &lt;strong&gt;감이 아닌 데이터로, 더 빠르고 정확한 의사결정&lt;/strong&gt;이 가능해집니다."
           data-en="See what your factory is producing right now and where money flows in and out — on one screen, in real time. &lt;strong&gt;Decisions driven by data, not gut feeling&lt;/strong&gt; — faster and more accurate."></p>
      </div>
    </div>

    <div class="stat-band">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E14134" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
          <path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>

      <p class="stat-text"
         data-ko="닷코를 통해 &lt;strong&gt;제조 정확도&lt;/strong&gt;를 올린 회사"
         data-en="Companies raising &lt;strong&gt;manufacturing accuracy&lt;/strong&gt; with DATCO"></p>
      <div class="stat-number">+73</div>

    <p class="hero-close"

  <!-- ===== 주요 기능 ===== -->
  <div class="section-label" data-ko="주요 기능" data-en="Key Features"></div>

  <!-- ===== 문서 자료 ===== -->
  <div class="section-label" data-ko="문서 자료" data-en="Documents"></div>
  <div class="doc-grid">
    <a class="card doc" href="https://drive.datco.kr/s/gieAqZwNSEY3cLo" target="_blank" rel="noopener">
      <span class="doc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#E14134" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="13" y2="17"/>

      </span>
      <span class="doc-body">
        <span class="doc-title" data-ko="회사소개서" data-en="Company Profile"></span>
        <span class="doc-sub" data-ko="AI 제조 플랫폼 닷코 소개" data-en="About DATCO, the AI manufacturing platform"></span>

<script>
  // ===== 한/영 전환 =====
  var btnKo = document.getElementById('btn-ko');
  var btnEn = document.getElementById('btn-en');

  function decode(s) {
    var t = document.createElement('textarea');
    t.innerHTML = s;
    return t.value;
  }
  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ko]').forEach(function (el) {
      el.innerHTML = decode(el.getAttribute(lang === 'ko' ? 'data-ko' : 'data-en'));
    });
    btnKo.classList.toggle('active', lang === 'ko');
    btnEn.classList.toggle('active', lang === 'en');
  }
  btnKo.addEventListener('click', function () { setLang('ko'); });
  btnEn.addEventListener('click', function () { setLang('en'); });
  setLang('ko');

  // ===== 썸네일 클릭 시 YouTube 플레이어 로드 =====
  document.querySelectorAll('.frame').forEach(function (frame) {
    var btn = frame.querySelector('.thumb-btn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var id = frame.getAttribute('data-video-id');
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
      iframe.title = 'YouTube video player';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      frame.replaceChild(iframe, btn);
    });
  });
</script>
